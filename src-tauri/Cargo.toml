[package]
name = "localview"
version = "0.1.0"
description = "A focused desktop browser for localhost development servers."
authors = ["LocalView Contributors"]
edition = "2021"

[lib]
name = "localview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "io-util", "net", "sync", "time"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
